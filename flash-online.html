<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>閃電小隊 連線雙打射擊</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{ --bg:#1b1d2a; --panel:#262a3b; --line:#3a3f57; --text:#eef0f7; --muted:#9aa0b8;
    --p0:#ff922b; --p1:#69db7c; --accent:#ffd43b; --red:#ff6b6b; --win:#51cf66; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 30% 0%,#2b3050,var(--bg) 60%);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  body.lob{display:flex;align-items:center;justify-content:center;padding:16px;min-height:100%}
  body.ingame{overflow:hidden;overscroll-behavior:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:10px}
  .back:hover{color:var(--accent)}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:2px} h1 b{color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.6}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#1d2030;color:var(--text);font-size:16px;outline:none}
  input:focus{border-color:var(--accent)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700}
  button:disabled{opacity:.45;cursor:default}
  .primary{background:var(--accent);color:#222;width:100%;margin-top:20px}
  .solo{width:100%;margin-top:10px;background:#33384f;color:var(--text)}
  .pls.one{grid-template-columns:1fr}
  .msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
  .msg.err{color:var(--red)}
  .hidden{display:none !important}

  #game{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:6px 6px 8px}
  .hrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:6px;margin-bottom:5px}
  .hbtns{display:flex;gap:6px;flex:none}
  .hbtns button{padding:6px 10px;font-size:12px;border-radius:8px;background:#33384f;color:var(--text)}
  .hbtns #newBtn{background:var(--win);color:#13311a}
  .pls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  .pl{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 8px;position:relative;min-width:0}
  .pl.p0{border-color:rgba(255,146,43,.55)} .pl.p1{border-color:rgba(105,219,124,.55)}
  .pl .nm{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden}
  .pl .nm i{flex:none;width:9px;height:9px;border-radius:50%}
  .pl.p0 .nm i{background:var(--p0)} .pl.p1 .nm i{background:var(--p1)}
  .pl .nm span{overflow:hidden;text-overflow:ellipsis}
  .pl .sc{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .pl .st{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .wn{position:absolute;right:7px;top:5px;font-size:11px;color:var(--muted)} .pl .wn b{color:var(--accent)}
  .pl .me{font-size:10px;background:var(--accent);color:#222;border-radius:5px;padding:0 4px;margin-left:2px}
  .wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .screen{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .ov{position:absolute;inset:0;background:rgba(15,17,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:18px;gap:10px;overflow:auto}
  .ov h2{margin:0;font-size:28px;letter-spacing:3px} .ov h2 b{color:var(--accent)}
  .ov p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
  .ov .big{font-size:16px;color:var(--text)}
  .diffs{display:flex;gap:8px}
  .diffs button{background:#33384f;color:var(--text);padding:10px 14px;border:2px solid transparent}
  .diffs button.sel{border-color:var(--accent);background:#454b68}
  .go{background:var(--accent);color:#222;padding:12px 36px;font-size:18px}
  .stages{display:flex;flex-direction:column;align-items:center;gap:4px}
  .stages p{margin:0;font-size:12px}
  .sgrid{display:grid;grid-template-columns:repeat(5,40px);gap:5px}
  .sgrid button{padding:6px 0;font-size:14px;background:#33384f;color:var(--text);border:2px solid transparent;border-radius:8px}
  .sgrid button.sel{border-color:var(--accent);background:#454b68}
  .sgrid button.lock{opacity:.35}
  .stages .sname{color:var(--text)!important}
  .ver{font-size:12px;color:var(--muted);margin:-10px 0 14px}
  .help{font-size:12px !important;text-align:left;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 12px;max-width:300px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
  .res div{background:#262a3b;border-radius:10px;padding:8px}
  .res .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .res .s{font-size:20px;font-weight:800}
  .res .top{outline:2px solid var(--accent)}
  .banner{position:absolute;left:10px;right:10px;top:10px;background:rgba(51,56,79,.95);border-radius:12px;padding:10px;text-align:center;font-size:14px}
  .banner .btns{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .banner button{padding:7px 16px;font-size:14px}
  .ok{background:var(--win);color:#13311a} .no{background:#4a4f68;color:var(--text)}
  .bombbtn{position:absolute;right:12px;bottom:12px;width:64px;height:64px;border-radius:50%;padding:0;font-size:28px;
    background:rgba(190,75,219,.35);border:2px solid rgba(230,150,255,.7);color:#fff}
  .bombbtn:active{background:rgba(190,75,219,.7)}
  .shieldbtn{position:absolute;left:12px;bottom:12px;width:64px;height:64px;border-radius:50%;padding:0;font-size:26px;line-height:1;
    background:rgba(34,184,207,.3);border:2px solid rgba(120,230,250,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .shieldbtn small{font-size:12px;font-weight:800;margin-top:1px}
  .shieldbtn:active{background:rgba(34,184,207,.65)}
  .shieldbtn.empty{opacity:.35} .shieldbtn.on{background:rgba(34,184,207,.75);box-shadow:0 0 16px rgba(120,230,250,.9)}
</style>
</head>
<body class="lob">

<!-- 大廳 -->
<div class="card" id="lobby">
  <a class="back" href="./">← 遊戲大廳</a>
  <h1>⚡ 閃電<b>小隊</b></h1>
  <p class="ver" id="ver"></p>
  <p class="sub">縱向捲軸射擊，擊破 10 關與各關 BOSS，難度逐關提升！兩人輸入同一個暗號即可連線合作、比分數；一個人也能按「單人出擊」直接玩（不用填暗號）。</p>
  <label for="nick">你的暱稱</label>
  <input id="nick" maxlength="12" placeholder="例如：小明">
  <label for="code">配對暗號</label>
  <input id="code" maxlength="30" placeholder="和朋友約好的暗號，例如：芒果布丁">
  <button class="primary" id="joinBtn">進入配對</button>
  <button class="solo" id="soloBtn">🎮 單人出擊（不用連線）</button>
  <div class="msg" id="lobbyMsg"></div>
</div>

<!-- 遊戲 -->
<div id="game" class="hidden">
  <div class="hrow"><span id="roundShow"></span><span class="hbtns"><button id="newBtn">開新局</button><button id="leaveBtn">離開</button></span></div>
  <div class="pls">
    <div class="pl p0" id="pl0"><div class="nm"><i></i><span id="name0">—</span></div><div class="sc" id="score0">0</div><div class="st" id="st0"></div><div class="wn">勝 <b id="win0">0</b></div></div>
    <div class="pl p1" id="pl1"><div class="nm"><i></i><span id="name1">—</span></div><div class="sc" id="score1">0</div><div class="st" id="st1"></div><div class="wn">勝 <b id="win1">0</b></div></div>
  </div>
  <div class="wrap" id="wrap">
    <div class="screen" id="screen">
      <canvas id="cv"></canvas>
      <div class="ov" id="ov"></div>
      <div class="banner hidden" id="banner"></div>
      <button class="bombbtn hidden" id="bombBtn" aria-label="投彈">💣</button>
      <button class="shieldbtn hidden" id="shieldBtn" aria-label="防護盾">🛡<small id="shN">0</small></button>
    </div>
  </div>
</div>

<script>
/* ================= 常數 ================= */
const W = 360, H = 640, STEP = 1000/60, STAGE_LEN = 80;   // 每關 80 秒後出 BOSS
const VERSION = 'v2.4';
const SHIELD_MAX = 5, SHIELD_TIME = 180, SHIELD_R = 26, SHIELD_P = .08;   // 最多存 5 個、每個 3 秒、護盾半徑、擊落掉落機率
const DIFFS = {
  // cap＝畫面上敵彈上限（超過就先不發射新的一波，保留閃躲空間）；ramp＝每關開火頻率增加幅度；late＝第 7 關起彈數 +1
  easy:   {name:'簡單', spd:.72, rate:.5,  extra:0, cap:40,  ramp:.03,  late:0},
  normal: {name:'普通', spd:1,   rate:.68, extra:0, cap:60,  ramp:.045, late:0},
  hard:   {name:'困難', spd:1.22,rate:1.45,extra:1, cap:140, ramp:.06,  late:1},
};
// 10 關：地圖、BOSS（bt=造型、tier=強化等級）、BOSS 血量、地面敵人種類
const STAGES = [
  {name:'綠野平原', boss:'鐵甲蟹',     bt:'boss1', tier:1, hp:700,  ground:'tank'},
  {name:'怒濤海域', boss:'海上要塞',   bt:'boss2', tier:1, hp:1000, ground:'boat'},
  {name:'敵軍要塞', boss:'空中母艦',   bt:'boss3', tier:1, hp:1400, ground:'tank'},
  {name:'沙漠峽谷', boss:'沙暴巨蟹',   bt:'boss1', tier:2, hp:1300, ground:'tank'},
  {name:'冰原基地', boss:'重裝直升機', bt:'boss4', tier:1, hp:1500, ground:'tank'},
  {name:'熔岩地帶', boss:'熔岩要塞',   bt:'boss2', tier:2, hp:1800, ground:'tank'},
  {name:'叢林河谷', boss:'叢林黑鷹',   bt:'boss4', tier:2, hp:1900, ground:'tank'},
  {name:'夜之都市', boss:'鋼鐵巨蟹',   bt:'boss1', tier:3, hp:2200, ground:'tank'},
  {name:'雷雲高空', boss:'雷霆母艦',   bt:'boss3', tier:2, hp:2500, ground:null},
  {name:'敵軍總部', boss:'雷神核心',   bt:'boss5', tier:1, hp:3200, ground:'tank'},
];
const LAST = STAGES.length - 1;
const DEF = {
  fighter:{hp:2,  r:12, score:100},
  heli:   {hp:8,  r:15, score:300},
  tank:   {hp:10, r:14, score:400, ground:1},
  boat:   {hp:12, r:14, score:400, ground:1},
  turret: {hp:16, r:15, score:600, ground:1},
  carrier:{hp:14, r:18, score:500},
  bomber: {hp:60, r:30, score:2000},
  boss1:  {hp:700,  hw:58, hh:38, score:20000, ground:1, boss:1},
  boss2:  {hp:1000, hw:44, hh:86, score:30000, ground:1, boss:1},
  boss3:  {hp:1400, hw:100,hh:28, score:50000, boss:1},
  jet:    {hp:4,  r:12, score:250},
  gunship:{hp:30, r:22, score:1200},
  fort:   {hp:45, r:22, score:1500, ground:1},
  boss4:  {hp:1500, hw:62, hh:44, score:60000, boss:1},
  boss5:  {hp:3200, hw:74, hh:62, score:150000, boss:1},
};
const TYPES = Object.keys(DEF);
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const r1 = v => Math.round(v*10)/10;

function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i=0;i<str.length;i++){ const c=str.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
const roomId = code => 'flashsq-' + cyrb53(code,1) + cyrb53(code,7);

/* ================= 連線狀態 ================= */
let peer=null, conn=null, role=null, mySlot=0, myName='', myCode='', leaving=false;
let state = null;   // 共用的「局」資訊（房主權威）
let G = null;       // 房主的遊戲模擬
let snap = null, snapAt = 0;   // 玩家端收到的最新畫面

function freshState(){
  return { names:[myName,null], wins:[0,0], clears:0, round:1, captain:0, diff:'normal',
           phase:'wait', stage:0, pending:null, result:null, revived:null, solo:false, best:0, startStage:0, unlocked:loadUnlock() };
}
function loadUnlock(){ try{ return Math.min(LAST, +localStorage.getItem('flash_unlock')||0); }catch(e){ return 0; } }
function saveUnlock(n){ try{ localStorage.setItem('flash_unlock', String(n)); }catch(e){} }
const mate = () => !!(state && (state.solo || state.names[1]));
/* 單人模式：不建立連線，自己當房主在本機跑模擬 */
function startSolo(){
  const n = $('nick').value.trim().slice(0,12);
  if (!n) return lobbyMsg('請先輸入暱稱', true);
  myName = n; try{ localStorage.setItem('flash_nick', n); }catch(e){}
  role = 'host'; mySlot = 0; myCode = '';
  state = freshState(); state.solo = true; state.phase = 'ready';
  showGame();
}

/* ================= 大廳 ================= */
try{ $('nick').value = localStorage.getItem('flash_nick') || ''; }catch(e){}
$('joinBtn').onclick = () => {
  const n = $('nick').value.trim().slice(0,12), c = $('code').value.trim();
  if (!n) return lobbyMsg('請先輸入暱稱', true);
  if (!c) return lobbyMsg('請輸入配對暗號', true);
  myName = n; myCode = c;
  try{ localStorage.setItem('flash_nick', n); }catch(e){}
  $('joinBtn').disabled = true; lobbyMsg('連線中…');
  tryHost(0);
};
$('soloBtn').onclick = startSolo;
$('ver').textContent = VERSION + '・新增：防護盾道具（左下按鈕）；第 7 關後 BOSS 彈幕減量';
['nick','code'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key==='Enter') $('joinBtn').click(); }));
// 連線錯誤 → 看得懂的說明
function netErr(t){
  if (t==='network' || t==='server-error' || t==='socket-error' || t==='socket-closed') return '連不上配對伺服器，請確認網路正常後再試一次';
  if (t==='browser-incompatible') return '這個瀏覽器不支援連線對戰，請改用 Chrome 或 Safari';
  if (t==='webrtc') return '兩台裝置之間無法建立連線，請兩人改連同一個 Wi-Fi 再試';
  return '連線失敗（' + t + '），請稍後再試';
}
function lobbyMsg(t, err){ $('lobbyMsg').textContent = t; $('lobbyMsg').className = 'msg'+(err?' err':''); }
function backToLobby(msg, err){
  cleanup();
  $('game').classList.add('hidden'); $('lobby').classList.remove('hidden');
  document.body.className = 'lob';
  $('joinBtn').disabled = false; lobbyMsg(msg||'', err);
}
function cleanup(){
  leaving = true;
  try{ conn && conn.close(); }catch(e){}
  try{ peer && peer.destroy(); }catch(e){}
  peer = conn = role = state = G = snap = null; fx.length = 0; local.init = false;
  setTimeout(()=>{ leaving=false; }, 50);
}

/* ================= 配對 ================= */
function tryHost(attempt){
  if (typeof Peer === 'undefined') return backToLobby('連線元件載入失敗，請確認網路後重新整理', true);
  const p = new Peer(roomId(myCode), {debug:0});
  peer = p;
  p.on('open', () => { if (peer===p) becomeHost(); });
  p.on('error', err => {
    if (peer!==p) return;
    if (err.type==='unavailable-id' && !role){ p.destroy(); joinAsGuest(attempt); }
    else if (!role) backToLobby(netErr(err.type), true);
  });
  p.on('disconnected', () => { if (peer===p && role==='host' && !p.destroyed) setTimeout(()=>{ try{p.reconnect();}catch(e){} }, 1500); });
}
function joinAsGuest(attempt){
  const p = new Peer({debug:0});
  peer = p; let timer;
  const retry = () => {
    clearTimeout(timer); if (peer!==p) return; p.destroy();
    if (attempt<3){ lobbyMsg('重新配對中…'); setTimeout(()=>tryHost(attempt+1), 1500); }
    else backToLobby('連不上對方。可能是兩人的網路（例如行動網路）擋住了直接連線：請兩人改連同一個 Wi-Fi 再試，或稍後再試', true);
  };
  p.on('open', () => {
    const c = p.connect(roomId(myCode), {reliable:true, serialization:'json'});
    timer = setTimeout(() => { if (!c.open) retry(); }, 8000);
    c.on('open', () => { clearTimeout(timer); conn=c; role='guest'; mySlot=1; c.send({type:'hello', name:myName}); });
    c.on('data', onGuestData);
    c.on('close', () => { if (peer===p && !leaving && role==='guest') backToLobby('隊友（房主）已離開，對局結束'); });
  });
  p.on('error', err => {
    if (peer!==p) return;
    if (err.type==='peer-unavailable') retry();
    else if (!role) backToLobby(netErr(err.type), true);
  });
}

/* ================= 房主 ================= */
function becomeHost(){
  role='host'; mySlot=0; state=freshState(); showGame();
  peer.on('connection', c => {
    if (conn && conn.open){ c.on('open', () => { c.send({type:'full'}); setTimeout(()=>c.close(), 400); }); return; }
    conn = c;
    c.on('data', d => onHostData(c, d));
    c.on('close', () => {
      if (conn!==c || leaving) return;
      conn = null; G = null; state = freshState();
      renderMeta(); toast('隊友已離開，等待新隊友加入…');
    });
  });
}
function onHostData(c, d){
  if (c!==conn || !d) return;
  const s = state;
  if (d.type==='hello'){ state = freshState(); state.names[1] = String(d.name||'玩家').slice(0,12); state.phase='ready'; G=null; sync(); }
  else if (d.type==='in'){ if (G) guestInput(d); }
  else if (d.type==='diff'){ if (s.phase==='ready' && s.captain===1 && DIFFS[d.d]){ s.diff=d.d; sync(); } }
  else if (d.type==='start'){ if (s.phase==='ready' && s.captain===1) startRun(); }
  else if (d.type==='stage'){ if (s.phase==='ready' && s.captain===1 && d.st>=0 && d.st<=s.unlocked){ s.startStage=d.st|0; sync(); } }
  else if (d.type==='newgame') requestNewGame(1);
  else if (d.type==='reply')   replyNewGame(1, !!d.accept);
}
function sync(){ renderMeta(); if (conn && conn.open) conn.send({type:'state', state}); }

function requestNewGame(slot){
  const s = state;
  if (!mate() || s.phase==='ready' || s.phase==='wait') return;
  if (s.solo) return nextRound();                                   // 單人：隨時直接重來
  if (s.phase==='over' || s.phase==='win') return nextRound();     // 已結束 → 直接開
  if (s.pending!==null && s.pending!==slot) return nextRound();    // 雙方都按了
  s.pending = slot; sync();                                         // 對局中 → 需隊友同意
}
function replyNewGame(slot, accept){
  if (state.pending===null || state.pending===slot) return;
  if (accept) nextRound(); else { state.pending=null; sync(); }
}
function nextRound(){
  const s = state;
  s.round++; s.captain = s.solo ? 0 : 1 - s.captain;   // 每局輪流當隊長（選難度、按出擊）
  s.phase='ready'; s.pending=null; s.result=null; s.revived=null; s.stage=0; G=null;
  sync();
}

/* ================= 遊戲模擬（只在房主端） ================= */
function newPlayer(i){
  return {x: state.solo ? W/2 : i? W/2+50 : W/2-50, y:H-90, alive:true, out:false, inv:150, weap:'V', lvl:1, mis:'', mlvl:0,
          bombs:3, lives:3, score:0, cd:0, mcd:0, respawn:0, seq:0, bseen:0, shields:0, shieldT:0, sseen:0};
}
function startRun(){
  G = {f:0, t:0, scroll:0, stage:0, eid:0, players:[newPlayer(0), state.solo ? Object.assign(newPlayer(1), {alive:false, out:true, lives:0, inv:0}) : newPlayer(1)], en:[], eb:[], ps:[], items:[], bombs:[],
       scrollV:1, ev:[], evi:0, warn:0, bossOn:false, bossDeadT:0, phaseT:0, overT:0, fxOut:[]};
  const st0 = clamp(state.startStage|0, 0, state.unlocked|0);
  G.players.forEach(p => { if (p.out) return; p.lvl = Math.min(5, 1 + Math.floor(st0*.6)); if (st0>=2){ p.mis='H'; p.mlvl=Math.min(4, Math.floor(st0/2)); } });
  state.phase='play'; state.pending=null; state.result=null; state.revived=null; state.from=st0;
  startStage(st0); sync();
}
function startStage(n){
  G.stage=n; G.t=0; G.en=[]; G.eb=[]; G.items=G.items.filter(i=>i.kind!=='medal'); G.ev=buildStage(n); G.evi=0;
  G.bossOn=false; G.bossDeadT=0; G.warn=0; G.shDrop=0;   // 這一關已掉落幾個防護盾
  state.stage=n;
  // 逐關難度：子彈速度、開火頻率逐關增加，但第 6 關後不再增加（後期靠新敵人與 BOSS 變化提升難度）
  const b = DIFFS[state.diff] || DIFFS.normal, m = Math.min(n, 5);
  G.dd = {spd: b.spd*(1+m*.035), rate: b.rate*(1+m*b.ramp), extra: b.extra + (n>=6 && b.late ? 1 : 0), cap: b.cap};
  if (n > (state.unlocked|0)){ state.unlocked = n; if (role==='host') saveUnlock(n); }
}
const D = () => (G && G.dd) || DIFFS[state.diff] || DIFFS.normal;
const rateN = n => Math.max(6, Math.round(n / D().rate));
const every = (e,n) => e.t % rateN(n) === 0;

function spawn(type, x, y, o){
  const d = DEF[type], n = G.stage;
  // 一般敵人血量每關 +8%；BOSS 用關卡表的血量，單人模式 60%
  const hp = d.boss ? Math.round(STAGES[n].hp * (state.solo ? .6 : 1)) : Math.round(d.hp*(1+n*.08)*10)/10;
  const e = Object.assign({id:++G.eid, type, x, y, vx:0, vy:0, t:0, a:Math.PI/2, hit:0}, d, {hp, maxhp:hp}, o||{});
  G.en.push(e); return e;
}
function target(x,y){
  let best=null, bd=1e9;
  for (const p of G.players) if (p.alive){ const d=(p.x-x)**2+(p.y-y)**2; if (d<bd){bd=d;best=p;} }
  return best;
}
const aimAt = (x,y) => { const p=target(x,y); return p ? Math.atan2(p.y-y, p.x-x) : Math.PI/2; };
function shoot(x,y,a,spd,kind){
  if (G.eb.length >= (D().cap||200)) return;
  const s = spd*D().spd;
  G.eb.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r: kind? 5.5:3.5, k:kind});
}
function fan(x,y,a0,spd,n,spreadDeg,kind){
  if (G.eb.length + n > (D().cap||200)) return;     // 整組放不下就整組不發，避免殘缺的彈幕
  const sp = spreadDeg*Math.PI/180;
  for (let i=0;i<n;i++) shoot(x,y, a0 + (i-(n-1)/2)*sp, spd, kind);
}
const fireAim = (x,y,spd,n,spread,kind) => fan(x,y,aimAt(x,y),spd,n,spread,kind);
function ring(x,y,n,spd,off,kind){ if (G.eb.length + n > (D().cap||200)) return; for (let i=0;i<n;i++) shoot(x,y, off + i*Math.PI*2/n, spd, kind); }

/* ---------- 關卡腳本 ---------- */
function buildStage(n){
  const ev=[]; const add=(t,f)=>ev.push({t:Math.round(t*60), f});
  const S = STAGES[n], ground = S.ground, L = STAGE_LEN;
  const pats = [
    () => { const x0=rnd(70,W-70), dir=Math.random()<.5?-1:1;
            for (let i=0;i<5;i++) spawn('fighter', x0, -20-i*34, {path:'dive', ph:i*.5, dir, fireAt: 30+(Math.random()*50|0)}); },
    () => { if (!ground) return spawnJets();
            const x0=rnd(50,W-130), mx=rnd(-.3,.3);
            for (let i=0;i<3;i++) spawn(ground, x0+i*40, -30-i*30, {my:.35, mx: ground==='boat'? (i%2?.6:-.6) : mx}); },
    () => { const dir=Math.random()<.5?1:-1;
            for (let i=0;i<5;i++) spawn('fighter', dir>0? -20-i*30 : W+20+i*30, 50+i*14, {path:'side', dir, fireAt: 40+(Math.random()*40|0)}); },
    () => { spawn('heli', W*.28, -30, {ty:rnd(110,200), stay:280}); spawn('heli', W*.72, -60, {ty:rnd(110,200), stay:300}); },
    () => { for (let i=0;i<4;i++) spawn('fighter', 60+i*80, -20-(i%2)*30, {path:'uturn', dir: i<2?-1:1, fireAt: 50}); },
    () => { if (!ground) return spawn('gunship', rnd(80,W-80), -40, {ty:rnd(90,160)});
            spawn('turret', rnd(40,W/2-30), -30); spawn('turret', rnd(W/2+30,W-40), -70); },
  ];
  function spawnJets(){ const dir=Math.random()<.5?1:-1; for (let i=0;i<3;i++) spawn('jet', W/2 - dir*(110 - i*40), -30-i*40, {dir}); }
  if (n>=3) pats.push(spawnJets);                                                       // 第 4 關起：高速噴射機
  if (n>=5) pats.push(() => spawn('gunship', rnd(80,W-80), -40, {ty:rnd(90,160)}));     // 第 6 關起：重砲艇
  if (n>=6 && ground) pats.push(() => spawn('fort', rnd(60,W-60), -40));                // 第 7 關起：地面要塞砲
  const gap = 3.4 - n*.17;                                     // 出怪間隔逐關縮短
  const dbl = n<2 ? 0 : Math.max(2, 5 - (n>>1));              // 第 3 關起：每幾波多一組敵人
  let k = 0;
  for (let t=3; t<L-5; t+=gap){
    const i = k++;
    add(t, () => pats[(i*5 + n*2 + (i>>2)) % pats.length]());
    if (dbl && i%dbl===1) add(t+gap/2, () => pats[(i*3+n+1) % pats.length]());
  }
  const drops = ['P','S','P','B','P','S'];
  [.08,.25,.42,.58,.74,.88].forEach((f,i) => add(f*L, () => spawn('carrier', rnd(60,W-60), -30, {drop:drops[i]})));
  const nb = 1 + Math.floor(n/3);                              // 轟炸機數量逐關增加
  for (let i=0;i<nb;i++) add(L*(i+1)/(nb+1), () => spawn('bomber', rnd(90,W-90), -40));
  add(L-3, () => { G.warn = 170; });
  add(L, () => { spawn(S.bt, W/2, -110, {tier:S.tier}); G.bossOn = true; });
  ev.sort((a,b)=>a.t-b.t);
  return ev;
}

/* ---------- 敵人行為 ---------- */
function upEnemy(e){
  e.t++; const d=D();
  switch(e.type){
    case 'fighter':
      if (e.path==='dive'){ e.vy=3.1; e.vx=Math.sin(e.t*.045+e.ph)*1.8*e.dir; }
      else if (e.path==='side'){ e.vx=e.dir*2.6; e.vy=1.2+e.t*.012; }
      else { if (e.t<70){ e.vy=3; e.vx=0; } else { e.vy=3-(e.t-70)*.09; e.vx=e.dir*1.8; } }
      e.a = Math.atan2(e.vy, e.vx);
      if (e.t===e.fireAt && e.y>0) fireAim(e.x,e.y,3,1+d.extra,10,0);
      break;
    case 'heli':
      e.vy = e.y<e.ty ? 2 : (e.t>e.stay ? 1.6 : .15); e.vx = Math.sin(e.t*.02)*.6;
      if (e.y>30 && e.t>40 && every(e,95)) fireAim(e.x,e.y,2.6,3+d.extra*2,14,0);
      break;
    case 'tank': case 'boat':
      e.vy = G.scrollV + (e.my||0); e.vx = e.mx||0;
      if (e.type==='boat' && (e.x<30 || e.x>W-30)) e.mx = -e.mx;
      e.a = aimAt(e.x,e.y);
      if (e.y>20 && every(e,130)) fan(e.x,e.y,e.a,2.4,1+d.extra,12,0);
      break;
    case 'turret':
      e.vy = G.scrollV; e.a = aimAt(e.x,e.y);
      if (e.y>20 && every(e,110)) fan(e.x,e.y,e.a,2.7,2+d.extra,9,0);
      break;
    case 'carrier': e.vy=1.1; e.vx=Math.sin(e.t*.015)*.8; break;
    case 'jet':                     // 高速俯衝，到中段連射 3 發後轉彎離開
      if (e.t<40){ e.vy=5; e.vx=0; } else { e.vy=Math.max(-1, 5-(e.t-40)*.15); e.vx=e.dir*Math.min(4,(e.t-40)*.12); }
      e.a = Math.atan2(e.vy, e.vx||.001);
      if (e.t>=34 && e.t<=46 && e.t%6===4 && e.y>0) fireAim(e.x,e.y,3.6,1+d.extra,6,0);
      break;
    case 'gunship':                 // 停在上方旋轉掃射
      e.vy = e.y<e.ty ? 1.6 : (e.t>460 ? 1.4 : 0); e.vx = Math.sin(e.t*.015)*.7;
      if (e.y>40 && every(e,11)) shoot(e.x,e.y,e.t*.11,2.2,0);
      if (e.y>40 && every(e,130)) ring(e.x,e.y,8+d.extra*4,1.9,e.t*.03,1);
      break;
    case 'fort':                    // 地面要塞砲：環狀彈＋大型瞄準彈
      e.vy = G.scrollV; e.a = aimAt(e.x,e.y);
      if (e.y>20 && every(e,120)) ring(e.x,e.y,12+d.extra*4,2.2,e.t*.05,0);
      if (e.y>20 && e.t%rateN(120)===60) fan(e.x,e.y,e.a,2.6,3,14,1);
      break;
    case 'bomber':
      e.vy = e.y<120 ? 1.2 : (e.t>520 ? 1.2 : .12); e.vx = Math.sin(e.t*.01)*.5;
      if (e.y>40 && every(e,70)) fireAim(e.x,e.y+10,2.4,5+d.extra*2,13,1);
      break;
    default: upBoss(e);
  }
  e.x += e.vx; e.y += e.vy; if (e.hit>0) e.hit--;
}
function upBoss(e){
  const d=D(), tx=(e.tier||1)-1, ph2 = e.hp < e.maxhp/2, ph3 = e.hp < e.maxhp/3;
  const air = e.type==='boss3' || e.type==='boss4' || e.type==='boss5';
  const stopY = e.type==='boss2' ? 150 : e.type==='boss5' ? 150 : 130;
  e.vy = e.y<stopY ? 1.1 : 0;
  e.vx = e.y>=stopY ? Math.cos(e.t*.012)*(e.type==='boss5' ? .5 : air ? 1.2 : .8) : 0;
  e.a = aimAt(e.x, e.y);
  if (e.y < stopY-10) return;
  e.p = (e.p||0) + 1;
  const R = n => rateN(n / (1 + .08*tx));          // 強化型 BOSS 開火稍快
  const cyc = Math.floor(e.p/260)%3, k = e.p%260, x=e.x, y=e.y, X = d.extra + tx;
  if (e.type==='boss1'){
    if (cyc===0 && k%R(34)===0) fireAim(x,y+10,3,3+X*2,12,0);
    if (cyc===1 && k%R(46)===0) ring(x,y,14+X*4,2.2,e.p*.05,0);
    if (cyc===2 && k%R(7)===0){ shoot(x,y,e.p*.13,2.6,0); shoot(x,y,e.p*.13+Math.PI,2.6,0); }
    if (ph2 && k%R(80)===0){ fireAim(x-50,y+20,2,3+tx,18,1); fireAim(x+50,y+20,2,3+tx,18,1); }
  } else if (e.type==='boss2'){
    if (cyc===0 && k%R(30)===0){ for (const [ox,oy] of [[-28,-45],[28,-45],[-28,40],[28,40]]) fireAim(x+ox,y+oy,2.8,1+Math.min(1,X),8,0); }
    if (cyc===1 && k%rateN(10)===0) fan(x,y+80,Math.PI/2+Math.sin(e.p*.05)*.9,2.6,3,10,0);
    if (cyc===2 && k%R(44)===0){ ring(x,y-60,12+X*3,2.1,e.p*.03,0); ring(x,y+60,12+X*3,2.1,-e.p*.03,0); }
    if (ph2 && k%R(60)===0) fireAim(x,y+80,2.2,5+tx,15,1);
  } else if (e.type==='boss3'){
    if (cyc===0 && k%R(6)===0){ for (let j=0;j<3+tx;j++) shoot(x,y+10,e.p*.09+j*Math.PI*2/(3+tx),2.5,0); }
    if (cyc===1 && k%R(18)===0){ fireAim(x-80,y+6,3,3+tx,10,0); fireAim(x+80,y+6,3,3+tx,10,0); }
    if (cyc===2){ if (k%R(52)===0) ring(x,y+10,14+X*4,2,e.p*.02,1); if (k===60 || k===180){ spawn('fighter',40,-20,{path:'dive',ph:0,dir:1,fireAt:40}); spawn('fighter',W-40,-20,{path:'dive',ph:1,dir:-1,fireAt:40}); } }
    if (ph2 && k%R(90)===0) fireAim(x,y+20,2,7+tx*2,10,1);
  } else if (e.type==='boss4'){   // 重裝直升機：機砲連射、飛彈扇形、旋轉彈幕
    if (cyc===0 && k%60<30 && k%R(5)===0){ fireAim(x-46,y+8,3.4,1,0,0); fireAim(x+46,y+8,3.4,1,0,0); }
    if (cyc===1 && k%R(36)===0) fan(x,y+40,Math.PI/2,2.3,5+X*2,14,1);
    if (cyc===2 && k%R(5)===0){ shoot(x,y,e.p*.17,2.4,0); shoot(x,y,-e.p*.17+Math.PI,2.4,0); }
    if (ph2 && k%R(55)===0){ fireAim(x-46,y+8,2.8,3,12,0); fireAim(x+46,y+8,2.8,3,12,0); }
    if (tx && k%R(130)===0) ring(x,y,16+X*2,2.1,e.p*.04,0);
  } else {                        // 雷神核心：四臂旋轉，血量越低越兇
    const arm = j => e.t*.012 + j*Math.PI/2, tip = j => [x+Math.cos(arm(j))*70, y+Math.sin(arm(j))*70];
    if (!ph2){
      if (k%R(24)===0) for (let j=0;j<4;j++){ const [ax,ay]=tip(j); fireAim(ax,ay,2.8,1+d.extra,8,0); }
      if (k%R(100)===0) ring(x,y,14+X*3,2,e.p*.03,1);
    } else if (!ph3){
      if (k%R(10)===0) for (let j=0;j<4;j++){ const [ax,ay]=tip(j); shoot(ax,ay,arm(j),2.3,0); }
      if (k%R(70)===0) fireAim(x,y+30,2.4,5+d.extra*2,12,1);
    } else {
      if (k%R(50)===0) ring(x,y,16+X*3,2.1,(e.p%100<50)?0:Math.PI/16,0);
      if (k%R(12)===0) for (let j=0;j<4;j++){ const [ax,ay]=tip(j); shoot(ax,ay,arm(j)+Math.PI/4,2.4,0); }
      if (k%R(60)===0) fireAim(x,y+30,2.6,5+d.extra*2,10,1);
      if (k===100) for (let i=0;i<3;i++) spawn('jet', 60+i*120, -30-i*30, {dir: i<1?1:-1});
    }
  }
}

/* ---------- 玩家 ---------- */
function playerFire(i){
  const p = G.players[i];
  if (--p.cd <= 0){
    if (p.weap==='V'){
      p.cd = 6;
      const n = [2,3,5,7,9][p.lvl-1];
      if (p.lvl===1){ addShot(i,p.x-5,p.y-14,-Math.PI/2,11,'v',1); addShot(i,p.x+5,p.y-14,-Math.PI/2,11,'v',1); }
      else for (let j=0;j<n;j++) addShot(i,p.x,p.y-14,-Math.PI/2+(j-(n-1)/2)*.14,11,'v',1);
    } else {
      p.cd = 3;
      addShot(i,p.x,p.y-20,-Math.PI/2,17,'l',1+p.lvl*.6, 3+p.lvl*2.2);
    }
  }
  if (p.mis && --p.mcd <= 0){
    p.mcd = p.mis==='H' ? 26 : 18;
    for (let j=0;j<p.mlvl;j++){
      const side = j%2 ? 1 : -1, off = (8 + (j>>1)*8)*side;
      if (p.mis==='H') addShot(i,p.x+off,p.y,-Math.PI/2-side*.5,6.5,'h',2);
      else addShot(i,p.x+off,p.y-4,-Math.PI/2,9,'m',3);
    }
  }
}
function addShot(o,x,y,a,spd,k,dmg,w){ G.ps.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,k,dmg,o,w:w||0,sp:spd}); }
function triggerBomb(i){
  const p = G.players[i];
  if (!p || !p.alive || p.bombs<=0 || G.bombs.some(b=>b.o===i)) return;
  p.bombs--; p.inv = Math.max(p.inv, 130);
  G.bombs.push({x:p.x, y:Math.max(110, p.y-150), t:0, o:i});
}
function triggerShield(i){
  const p = G.players[i];
  if (!p || !p.alive || p.shields<=0 || p.shieldT>0) return;
  p.shields--; p.shieldT = SHIELD_TIME;
}
function killPlayer(i){
  const p = G.players[i];
  if (!p.alive) return;
  boom(p.x,p.y,4);
  spawnItem('P', p.x, p.y);
  p.alive=false; p.lives--; p.lvl=1; p.mlvl=Math.min(p.mlvl,1); p.bombs=3;
  if (p.lives<=0){ p.out=true; if (G.players.every(q=>q.out)) G.overT = 130; }
  else p.respawn = 90;
}
function respawn(i){
  const p = G.players[i];
  p.alive=true; p.x = state.solo ? W/2 : i? W/2+50 : W/2-50; p.y=H-90; p.inv=150; p.seq++;
}
function guestInput(d){
  const p = G.players[1];
  if (!p.alive) { if (d.b>p.bseen) p.bseen=d.b; if (d.sh>p.sseen) p.sseen=d.sh; return; }
  if (typeof d.x==='number' && typeof d.y==='number'){ p.x = clamp(d.x,12,W-12); p.y = clamp(d.y,20,H-20); }
  if (d.b > p.bseen){ p.bseen = d.b; triggerBomb(1); }
  if (d.sh > p.sseen){ p.sseen = d.sh; triggerShield(1); }
}

/* ---------- 道具 ---------- */
function spawnItem(kind,x,y){
  if (kind==='medal') G.items.push({id:++G.eid, kind, x, y, vx:0, vy:0, life:0});
  else { const a = rnd(0,Math.PI*2); G.items.push({id:++G.eid, kind, x, y, vx:Math.cos(a)*1.3, vy:Math.sin(a)*1.3-.4, life:0}); }
}
const itemCol = it => Math.floor((G.f + it.id*53)/100) % 2;    // 0/1 交替顏色
function pickItem(p, it){
  const c = itemCol(it);
  if (it.kind==='P'){ const w = c? 'L':'V'; if (p.weap===w){ if (p.lvl<5) p.lvl++; else p.score+=5000; } else p.weap=w; }
  else if (it.kind==='S'){ const m = c? 'M':'H'; if (p.mis===m){ if (p.mlvl<4) p.mlvl++; else p.score+=5000; } else { p.mis=m; p.mlvl=Math.max(1,p.mlvl); } }
  else if (it.kind==='B'){ p.bombs = Math.min(7, p.bombs+1); }
  else if (it.kind==='D'){ if (p.shields < SHIELD_MAX) p.shields++; else p.score += 1000; }
  else p.score += 500;
}

/* ---------- 傷害 ---------- */
function hits(e, x, y, rr){
  if (e.hw) return Math.abs(e.x-x) < e.hw+rr && Math.abs(e.y-y) < e.hh+rr;
  return (e.x-x)**2 + (e.y-y)**2 < (e.r+rr)**2;
}
function damage(e, dmg, o){
  if (e.hp<=0) return;
  e.hp -= dmg; e.hit = 3;
  const p = G.players[o]; if (p) p.score += 5;
  if (e.hp > 0) return;
  if (p) p.score += e.score;
  if (e.boss){
    G.bossDeadT = 170; G.eb = [];
    for (const q of G.players) if (!q.out) q.score += e.score/2;
    boom(e.x,e.y,8);
  } else {
    boom(e.x, e.y, e.type==='bomber'? 5 : e.ground? 2.4 : 2);
    if (e.drop) spawnItem(e.drop, e.x, e.y);
    if (e.type==='turret' || (e.ground && Math.random()<.35)) spawnItem('medal', e.x, e.y);
    if (e.type==='bomber') spawnItem(Math.random()<.5?'B':'P', e.x, e.y);
    // 防護盾：擊落敵人隨機掉落，每關上限 單人 7 個、雙人 10 個
    if (G.shDrop < (state.solo ? 7 : 10) && Math.random() < SHIELD_P){ G.shDrop++; spawnItem('D', e.x, e.y); }
  }
}

/* ---------- 每一格 ---------- */
function simStep(){
  const g = G; g.f++;
  g.scrollV = state.phase==='play' && g.bossOn ? .4 : 1; g.scroll += g.scrollV;
  if (state.phase==='play'){
    g.t++;
    while (g.evi < g.ev.length && g.ev[g.evi].t <= g.t){ g.ev[g.evi++].f(); }
    if (g.warn>0) g.warn--;
  }
  // 玩家
  g.players.forEach((p,i) => {
    if (p.inv>0) p.inv--;
    if (p.shieldT>0) p.shieldT--;
    if (!p.alive){ if (!p.out && --p.respawn<=0 && state.phase==='play') respawn(i); return; }
    if (state.phase==='play') playerFire(i);
  });
  // 玩家子彈
  for (const s of g.ps){
    if (s.k==='h'){
      if (!s.tg || s.tg.hp<=0 || g.f%6===0){ let bd=1e9; s.tg=null; for (const e of g.en){ if (e.y<0) continue; const d=(e.x-s.x)**2+(e.y-s.y)**2; if (d<bd){bd=d;s.tg=e;} } }
      if (s.tg){ const a=Math.atan2(s.vy,s.vx), ta=Math.atan2(s.tg.y-s.y,s.tg.x-s.x); let da=ta-a; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
        const na=a+clamp(da,-.13,.13); s.vx=Math.cos(na)*s.sp; s.vy=Math.sin(na)*s.sp; }
    }
    s.x+=s.vx; s.y+=s.vy;
    for (const e of g.en){
      if (e.hp>0 && e.y>-20 && hits(e, s.x, s.y, s.w/2+3)){ damage(e, s.dmg, s.o); s.dead=1; break; }
    }
  }
  g.ps = g.ps.filter(s => !s.dead && s.y>-30 && s.y<H+30 && s.x>-30 && s.x<W+30);
  // 敵人
  for (const e of g.en){
    if (e.hp<=0) continue;
    upEnemy(e);
    if (!e.ground && !e.boss) for (let i=0;i<2;i++){ const p=g.players[i];
      if (p.alive && p.inv===0 && hits(e,p.x,p.y,5)){ killPlayer(i); damage(e,20,i); } }
  }
  g.en = g.en.filter(e => e.hp>0 && e.y<H+70 && e.y>-320 && e.x>-220 && e.x<W+220);
  // 敵彈
  for (const b of g.eb){
    b.x+=b.vx; b.y+=b.vy;
    for (let i=0;i<2;i++){ const p=g.players[i]; if (!p.alive || b.dead) continue;
      const d2 = (p.x-b.x)**2+(p.y-b.y)**2;
      if (p.shieldT>0){ if (d2 < (SHIELD_R+b.r)**2) b.dead=1; continue; }      // 防護盾擋下子彈
      if (p.inv===0 && d2 < (b.r+2.5)**2){ killPlayer(i); b.dead=1; } }
  }
  g.eb = g.eb.filter(b => !b.dead && b.y>-20 && b.y<H+20 && b.x>-20 && b.x<W+20);
  // 炸彈
  for (const bm of g.bombs){
    bm.t++;
    if (bm.t===30){ g.eb=[]; boom(bm.x,bm.y,6); }
    if (bm.t>=30){ g.eb=[]; const R=(bm.t-30)/40*200; for (const e of g.en) if (e.y>-30 && (e.x-bm.x)**2+(e.y-bm.y)**2 < (R+40)**2) damage(e, e.boss? 1.1 : 3, bm.o); }
  }
  g.bombs = g.bombs.filter(b => b.t<72);
  // 道具
  for (const it of g.items){
    it.life++;
    if (it.kind==='medal'){ it.y += g.scrollV; }
    else {
      it.x+=it.vx; it.y+=it.vy;
      if (it.life<560){ if (it.x<12||it.x>W-12) it.vx=-it.vx; if (it.y<30||it.y>H-12) it.vy=-it.vy; it.x=clamp(it.x,12,W-12); it.y=clamp(it.y,30,H-12); }
    }
    for (const p of g.players) if (p.alive && (p.x-it.x)**2+(p.y-it.y)**2 < 22*22){ pickItem(p,it); it.dead=1; break; }
  }
  g.items = g.items.filter(it => !it.dead && it.y<H+30 && it.y>-40 && it.x>-40 && it.x<W+40);
  // BOSS 擊破 → 過關
  if (g.bossDeadT>0){
    g.bossDeadT--;
    if (g.bossDeadT%12===0) boom(W/2+rnd(-90,90), rnd(80,240), 3);
    if (g.bossDeadT===0) stageClear();
  }
  if (state.phase==='clear' && --g.phaseT<=0){
    if (g.stage<LAST){ startStage(g.stage+1); state.phase='play'; state.revived=null; state.bonus=0; sync(); }
    else finish(true);
  }
  if (g.overT>0 && --g.overT===0 && state.phase==='play') finish(false);
}
function stageClear(){
  const g=G; g.eb=[]; g.en=[]; g.phaseT = 250;
  const rev = [];
  const bonus = g.stage%3===2 ? 1 : 0;                       // 過第 3、6、9 關：每人 +1 架（最多 5 架）
  g.players.forEach((p,i) => { if (state.solo && i===1) return; if (bonus && !p.out) p.lives = Math.min(5, p.lives+1); if (p.out){ p.out=false; p.lives=2; respawn(i); rev.push(i); } else if (!p.alive){ respawn(i); } });
  state.phase='clear'; state.revived = rev; state.bonus = bonus; sync();
}
function finish(win){
  const sc = G.players.map(p=>Math.round(p.score));
  const s = state;
  s.phase = win? 'win' : 'over'; s.pending=null;
  s.result = {scores:sc, stage:G.stage, win, from:s.from|0};
  if (s.solo) s.best = Math.max(s.best||0, sc[0]);
  else if (sc[0]!==sc[1]) s.wins[sc[0]>sc[1]?0:1]++;
  if (win) s.clears++;
  sync();
}

/* ---------- 快照（房主 → 玩家） ---------- */
function makeSnap(){
  const g=G, boss=g.en.find(e=>e.boss);
  return {
    type:'snap', f:g.f, st:g.stage, s:Math.round(g.scroll), sv:g.scrollV, wn:g.warn, t:g.t,
    P: g.players.map(p => [Math.round(p.x),Math.round(p.y),p.alive?1:0,p.inv,p.weap,p.lvl,p.mis,p.mlvl,p.bombs,p.lives,Math.round(p.score),p.seq,p.out?1:0,p.shields,p.shieldT]),
    E: g.en.map(e => [TYPES.indexOf(e.type),Math.round(e.x),Math.round(e.y),r1(e.vx),r1(e.vy),r1(e.a),e.hit,e.t]),
    B: g.eb.map(b => [Math.round(b.x),Math.round(b.y),r1(b.vx),r1(b.vy),b.k]),
    S: g.ps.map(s => [Math.round(s.x),Math.round(s.y),r1(s.vx),r1(s.vy),s.k,Math.round(s.w)]),
    I: g.items.map(it => [it.kind,Math.round(it.x),Math.round(it.y),r1(it.vx),r1(it.vy),itemCol(it)]),
    M: g.bombs.map(b => [Math.round(b.x),Math.round(b.y),b.t]),
    bh: boss ? r1(Math.max(0,boss.hp)/boss.maxhp*100) : -1,
    X: g.fxOut.splice(0),
  };
}

function onGuestData(d){
  if (!d) return;
  if (d.type==='full') return backToLobby('房間已滿，請換暗號', true);
  if (d.type==='state'){
    const first = !state; state = d.state;
    if (first) showGame();
    if (state.phase==='ready' || state.phase==='wait'){ snap=null; local.init=false; }
    renderMeta();
  } else if (d.type==='snap'){
    for (const x of d.X) addFx(x[0],x[1],x[2]);
    const me = d.P[1];
    if (!local.init || me[11]!==local.seq){ local.x=me[0]; local.y=me[1]; local.seq=me[11]; local.init=true; }
    snap = d; snapAt = performance.now();
  }
}

const keys = {};
const local = {x:W/2+50, y:H-90, init:false, seq:0, bomb:0, sh:0};
let dragDX=0, dragDY=0, lastPt=null;
addEventListener('keydown', e => {
  if (!state || $('game').classList.contains('hidden')) return;
  if (e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase(); keys[k]=true;
  if (k===' ' || k==='x' || k==='b') { doBomb(); e.preventDefault(); }
  if (k==='z' || k==='c' || k==='shift') { doShield(); e.preventDefault(); }

const screenEl = $('screen');
screenEl.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;

  try{ screenEl.setPointerCapture(e.pointerId); }catch(_){}
});

  if (!lastPt || e.pointerId!==lastPt.id) return;
  const k = W / (screenEl.clientWidth || W) * 1.15;

});

function doBomb(){
  if (!state || state.phase!=='play') return;
  if (role==='host'){ if (G) triggerBomb(0); }
  else { local.bomb++; conn && conn.open && conn.send({type:'in', x:local.x, y:local.y, b:local.bomb, sh:local.sh}); }
}
function doShield(){
  if (!state || state.phase!=='play') return;
  if (role==='host'){ if (G) triggerShield(0); }
  else { local.sh++; conn && conn.open && conn.send({type:'in', x:local.x, y:local.y, b:local.bomb, sh:local.sh}); }
}
function moveLocal(pos){
  const sp = 4.6;
  let dx = ((keys.arrowright||keys.d)?1:0) - ((keys.arrowleft||keys.a)?1:0);
  let dy = ((keys.arrowdown||keys.s)?1:0) - ((keys.arrowup||keys.w)?1:0);
  if (dx && dy){ dx*=.7071; dy*=.7071; }
  const mx = clamp(dragDX,-26,26), my = clamp(dragDY,-26,26);
  dragDX -= mx; dragDY -= my;
  pos.x = clamp(pos.x + dx*sp + mx, 12, W-12);
  pos.y = clamp(pos.y + dy*sp + my, 20, H-20);
}

/* ================= 主迴圈 ================= */
let acc=0, lastT=0, stepN=0, loopOn=false;
function startLoop(){ if (loopOn) return; loopOn=true; lastT=performance.now(); requestAnimationFrame(frame); startTicker(); }
function pump(ts){ acc += Math.min(Math.max(0, ts-lastT), 100); lastT = ts; while (acc >= STEP){ acc -= STEP; step(); } }
function frame(ts){ requestAnimationFrame(frame); pump(ts); draw(); }
// 分頁在背景時瀏覽器會暫停 requestAnimationFrame：改用 Worker 計時器繼續推進遊戲，
// 這樣房主切到別的分頁／App 時，隊友的畫面不會整個卡住。
function startTicker(){
  const tick = () => { if (document.hidden) pump(performance.now()); };
  try{
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},16)'], {type:'text/javascript'})));
    w.onmessage = tick;
  }catch(e){ setInterval(tick, 50); }
}
function netFree(){
  const dc = conn && conn.dataChannel;
  return !(conn.bufferSize > 0) && !(dc && dc.bufferedAmount > 32*1024);
}
function step(){
  stepN++;
  updFx();
  if (!state) return;
  const playing = state.phase==='play' || state.phase==='clear';
  if (role==='host' && G){
    const me = G.players[0];
    if (me.alive && playing) moveLocal(me); else { dragDX=dragDY=0; }
    if (playing) simStep();
    // 網路塞住時先不送（避免舊畫面越積越多、隊友越來越延遲），等送得出去再送最新畫面
    if (stepN%2===0 && conn && conn.open && netFree()) conn.send(makeSnap());
  } else if (role==='guest'){
    const me = snap && snap.P[1];
    if (me && me[2] && playing) moveLocal(local); else { dragDX=dragDY=0; }
    if (stepN%2===0 && conn && conn.open && playing) conn.send({type:'in', x:Math.round(local.x), y:Math.round(local.y), b:local.bomb, sh:local.sh});
  }
}

/* ================= 特效（各自在本機播放） ================= */
const fx = [];
function boom(x,y,size){ addFx(x,y,size); if (G) G.fxOut.push([Math.round(x),Math.round(y),size]); }
function addFx(x,y,size){
  const parts=[]; const n = 6 + size*4;
  for (let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(.5,1.6)*(1+size*.5); parts.push([x,y,Math.cos(a)*s,Math.sin(a)*s]); }
  fx.push({x,y,size,t:0,L:22+size*5,parts});
  if (fx.length>80) fx.shift();
}
function updFx(){
  for (const f of fx){ f.t++; for (const p of f.parts){ p[0]+=p[2]; p[1]+=p[3]; p[2]*=.94; p[3]*=.94; } }
  while (fx.length && fx[0].t>fx[0].L) fx.shift();
  for (let i=fx.length-1;i>=0;i--) if (fx[i].t>fx[i].L) fx.splice(i,1);
}

function drawBg(st, s){

          break;

    else if (st===4){ const rx = 180 + Math.sin(r*.1)*90; c.fillStyle='#b0c4d6'; c.fillRect(rx-20,y,40,T+1); }

  }
}

const P_SHIP = [0,-20, 4,-8, 17,3, 17,8, 4,6, 3,12, 9,16, 9,19, -9,19, -9,16, -3,12, -4,6, -17,8, -17,3, -4,-8];
const E_FIGHTER = [0,14, 4,4, 13,-2, 13,-6, 3,-4, 3,-12, 7,-15, -7,-15, -3,-12, -3,-4, -13,-6, -13,-2, -4,4];
const E_BOMBER = [0,30, 8,10, 40,0, 40,-8, 8,-6, 6,-26, -6,-26, -8,-6, -40,-8, -40,0, -8,10];

function drawPlayer(x,y,col,inv,f){
  if (inv>0 && f%8<4) return;

    const n = $('name'+i); n.textContent = s.names[i] || '等待隊友加入…';
    if (i===mySlot && s.names[1]) n.append(el('span','me','你'));
    $('win'+i).textContent = s.wins[i];
  });
  $('pl1').classList.toggle('hidden', !!s.solo); $('pl0').parentNode.classList.toggle('one', !!s.solo);
  $('pl0').querySelector('.wn').classList.toggle('hidden', !!s.solo);
  if (s.solo) $('roundShow').textContent = `單人模式・${(DIFFS[s.diff]||DIFFS.normal).name}` + (s.phase==='play'||s.phase==='clear' ? `・第 ${s.stage+1}/${STAGES.length} 關` : '') + (s.best ? `・最高分 ${s.best.toLocaleString()}` : '');
  else $('roundShow').textContent = s.names[1]
    ? `第 ${s.round} 局・隊長：${nm(cap)}・${(DIFFS[s.diff]||DIFFS.normal).name}` + (s.phase==='play'||s.phase==='clear' ? `・第 ${s.stage+1}/${STAGES.length} 關` : '') + (s.clears? `・通關 ${s.clears} 次`:'')
    : '等待隊友';
  $('newBtn').disabled = !mate() || s.phase==='ready' || s.phase==='wait';
  $('bombBtn').classList.toggle('hidden', s.phase!=='play');
  $('shieldBtn').classList.toggle('hidden', s.phase!=='play');

  ov.innerHTML = ''; ov.classList.remove('hidden');
  if (s.phase==='wait'){
    ov.append(el('h2',null,'⚡ 閃電小隊'), el('p','big', toastT || '把暗號告訴朋友，等待隊友加入…'), el('p',null,'暗號：'+myCode));
  } else if (s.phase==='ready'){
    const h = el('h2'); h.append('⚡ 閃電', el('b',null,'小隊')); ov.append(h);
    ov.append(el('p','big', s.solo ? '單人模式：選擇難度後出擊' : cap===mySlot ? '你是本局隊長，請選擇難度後出擊' : `等待隊長 ${s.names[cap]} 選擇難度並出擊…`));
    const ds = el('div','diffs');
    for (const k of Object.keys(DIFFS)){
      const b = el('button', k===s.diff?'sel':'', DIFFS[k].name); b.disabled = cap!==mySlot;
      b.onclick = () => { if (role==='host'){ s.diff=k; sync(); } else conn.send({type:'diff', d:k}); };
      ds.append(b);
    }
    ov.append(ds);
    // 起始關卡：可從曾經到達過的關卡出發（越後面起始火力越強）
    const sw = el('div','stages'); sw.append(el('p',null,'起始關卡（已到達 ' + ((s.unlocked|0)+1) + ' 關）'));
    const sg = el('div','sgrid');
    STAGES.forEach((S,i) => {
      const lock = i > (s.unlocked|0), b = el('button', (i===(s.startStage|0)?'sel':'') + (lock?' lock':''), lock ? '🔒' : String(i+1));
      b.title = S.name; b.disabled = lock || cap!==mySlot;
      b.onclick = () => { if (role==='host'){ s.startStage=i; sync(); } else conn.send({type:'stage', st:i}); };
      sg.append(b);
    });
    sw.append(sg, el('p','sname', `第 ${(s.startStage|0)+1} 關・${STAGES[s.startStage|0].name}（BOSS：${STAGES[s.startStage|0].boss}）`));
    ov.append(sw);
    if (cap===mySlot){ const g = el('button','go','出擊！'); g.onclick = () => { if (role==='host') startRun(); else conn.send({type:'start'}); }; ov.append(g); }
    const help = el('p','help');
    help.innerHTML = '📱 手指在畫面任意處拖曳移動，自動射擊，右下 💣 投彈、左下 🛡 防護盾<br>⌨️ 方向鍵／WASD 移動，空白鍵投彈、Z 防護盾（滑鼠也能拖曳）<br>'+
      '<b style="color:#fa5252">P</b>／<b style="color:#339af0">P</b> 紅藍交替：同色升級、異色換武器<br>'+
      '<b style="color:#fcc419">H</b> 追蹤彈／<b style="color:#51cf66">M</b> 直射彈・<b style="color:#be4bdb">B</b> 炸彈・金幣加分<br>'+
      '<b style="color:#15aabf">盾</b> 防護盾：擊落敵人隨機掉落，最多存 5 個；按左下 🛡（鍵盤 Z）擋 3 秒所有子彈<br>'+
      (s.solo ? '共 3 架，全部被擊落就結束' : '每人 3 架，被擊落後隊友撐到過關就能救你回來') + '<br>每過 3 關每人 +1 架（最多 5 架）';
    ov.append(help);
    if (toastT) ov.append(el('p',null,toastT));
  } else if (s.phase==='clear'){
    ov.style.background='rgba(15,17,28,.55)';
    ov.append(el('h2',null,`第 ${s.stage+1} 關 完成！`), el('p','big', s.stage<LAST ? `準備前往第 ${s.stage+2} 關：` + STAGES[s.stage+1].name : '最終 BOSS 擊破！'));
    if (s.bonus) ov.append(el('p',null, '🎁 過關獎勵：每人 +1 架'));
    if (s.revived && s.revived.length) ov.append(el('p',null, '🛟 隊友救援：' + s.revived.map(nm).join('、') + ' 回來了！'));
  } else if (s.phase==='over' || s.phase==='win'){
    const r = s.result || {scores:[0,0]};
    ov.append(el('h2',null, s.phase==='win' ? '🎉 任務完成！' : '💥 任務失敗'));
    ov.append(el('p','big', s.phase==='win' ? (s.solo ? `你獨自擊破了全部 ${STAGES.length} 關！` : `兩人一起擊破了全部 ${STAGES.length} 關！`) : `在第 ${r.stage+1} 關「${STAGES[r.stage].name}」` + (s.solo ? '被擊落了' : '全員被擊落')));
    if (r.from) ov.append(el('p',null, `（從第 ${r.from+1} 關出發）`));
    if (s.solo){
      ov.append(el('p','big', '分數：' + r.scores[0].toLocaleString()), el('p',null, r.scores[0] >= s.best ? '🏆 新的最高分！' : '最高分：' + s.best.toLocaleString()));
      const b = el('button','go','再玩一次'); b.onclick = () => $('newBtn').click(); ov.append(b);
    } else {
    const res = el('div','res'); const top = r.scores[0]===r.scores[1] ? -1 : (r.scores[0]>r.scores[1]?0:1);
    [0,1].forEach(i => { const d = el('div', i===top?'top':''); d.append(el('div','n', (i===top?'🏆 ':'') + s.names[i]), el('div','s', r.scores[i].toLocaleString())); res.append(d); });
    ov.append(res, el('p',null, top<0 ? '分數平手！' : `本局分數較高：${nm(top)}`));
    const b = el('button','go','開新局'); b.onclick = () => $('newBtn').click(); ov.append(b);
    }
  } else {
    ov.classList.add('hidden'); ov.style.background='';
  }
  if (s.phase!=='clear') ov.style.background='';
  if (s.phase==='play') ov.classList.add('hidden');

  const bn = $('banner');
  if (s.pending!==null && s.names[1]){
    bn.classList.remove('hidden'); bn.innerHTML='';
    if (s.pending===mySlot) bn.textContent = '已送出「開新局」請求，等待隊友同意…';
    else {
      bn.append(document.createTextNode(s.names[s.pending] + ' 想放棄這一輪、開新局，同意嗎？'));
      const btns = el('div','btns'), y = el('button','ok','同意'), n = el('button','no','拒絕');
      y.onclick = () => reply(true); n.onclick = () => reply(false); btns.append(y,n); bn.append(btns);
    }
  } else bn.classList.add('hidden');
  if (s.phase==='play' && toastT){ bn.classList.remove('hidden'); bn.textContent = toastT; }
}
function reply(accept){ if (role==='host') replyNewGame(0, accept); else conn.send({type:'reply', accept}); }
$('newBtn').onclick = () => {
  if (!state || !mate()) return;
  if (role==='host') requestNewGame(0); else conn.send({type:'newgame'});
};
$('leaveBtn').onclick = () => backToLobby('');
addEventListener('beforeunload', () => { try{ peer && peer.destroy(); }catch(e){} });
</script>
</body>
</html>
