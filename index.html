<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線小遊戲大廳</title>
<style>
  :root{ --bg:#1b1d2a; --panel:#262a3b; --line:#3a3f57; --text:#eef0f7; --muted:#9aa0b8; --accent:#ffd43b; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0%,#2b3050,var(--bg) 60%);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:24px 16px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:520px}
  h1{margin:8px 0 4px;font-size:28px;letter-spacing:1px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
  .game{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:16px;margin-bottom:14px;transition:transform .15s,border-color .15s;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .game:hover,.game:active{transform:translateY(-2px);border-color:var(--accent)}
  .icon{flex:none;width:76px;height:76px;border-radius:16px;background:#1d2030;display:flex;align-items:center;justify-content:center}
  .icon svg{width:62px;height:62px}
  .info{flex:1;min-width:0}
  .info h2{margin:0 0 4px;font-size:19px}
  .info p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.5}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;background:#33384f;border-radius:999px;padding:2px 9px}
  .go{flex:none;font-size:22px;color:var(--accent)}
  .how{background:#22263a;border:1px dashed var(--line);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7;margin-top:22px}
  .how b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <h1>連線<span>小遊戲</span>大廳</h1>
  <p class="sub">選一款遊戲，和朋友輸入同一個暗號就能連線對戰。手機、電腦都能玩。</p>

  <a class="game" href="ox-online.html">
    <div class="icon"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
      <path d="M36 12V88M64 12V88M12 36H88M12 64H88" stroke="#3a3f57" stroke-width="5"/>
      <path d="M17 17L31 31M31 17L17 31" stroke="#ff6b6b" stroke-width="6"/>
      <circle cx="50" cy="50" r="8" stroke="#4dabf7" stroke-width="6"/>
      <path d="M69 69L83 83M83 69L69 83" stroke="#ff6b6b" stroke-width="6"/>
      <circle cx="76" cy="24" r="8" stroke="#4dabf7" stroke-width="6"/>
    </svg></div>
    <div class="info">
      <h2>井字 OX</h2>
      <p>三個 O 或三個 X 連成一線（含斜線）就獲勝，每局輪流先手。</p>
      <div class="tags"><span class="tag">👥 2 人</span><span class="tag">⏱ 1 分鐘一局</span></div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="game" href="bingo-online.html">
    <div class="icon"><svg viewBox="0 0 100 100">
      <g font-family="system-ui,sans-serif" font-weight="800" font-size="13" text-anchor="middle">
        <rect x="8" y="8" width="84" height="84" rx="10" fill="#3a3f57"/>
        <g fill="#1d2030">
          <rect x="12" y="12" width="24" height="24" rx="5"/><rect x="38" y="12" width="24" height="24" rx="5"/><rect x="64" y="12" width="24" height="24" rx="5"/>
          <rect x="12" y="38" width="24" height="24" rx="5"/><rect x="38" y="38" width="24" height="24" rx="5"/><rect x="64" y="38" width="24" height="24" rx="5"/>
          <rect x="12" y="64" width="24" height="24" rx="5"/><rect x="38" y="64" width="24" height="24" rx="5"/><rect x="64" y="64" width="24" height="24" rx="5"/>
        </g>
        <circle cx="24" cy="24" r="10" fill="#ffd43b"/><circle cx="50" cy="50" r="10" fill="#4dabf7"/><circle cx="76" cy="76" r="10" fill="#ff6b6b"/>
        <text x="24" y="29" fill="#1b1d2a">7</text><text x="50" y="55" fill="#1b1d2a">13</text><text x="76" y="81" fill="#1b1d2a">21</text>
        <text x="76" y="29" fill="#9aa0b8">4</text><text x="24" y="81" fill="#9aa0b8">18</text><text x="50" y="29" fill="#9aa0b8">2</text>
      </g>
    </svg></div>
    <div class="info">
      <h2>1-25 賓果</h2>
      <p>每人一張亂數號碼盤，輪流選號，最先連成 5 條線的人獲勝。</p>
      <div class="tags"><span class="tag">👥 2～6 人</span><span class="tag">⏱ 5 分鐘一局</span></div>
    </div>
    <div class="go">›</div>
  </a>

  <div class="how">
    <b>怎麼和朋友一起玩？</b><br>
    1. 把這個頁面的網址傳給朋友。<br>
    2. 大家選同一款遊戲，輸入各自的暱稱和<b>同一個暗號</b>。<br>
    3. 配對成功就會自動開始，遊戲裡隨時可以按「開新局」再來一局。
  </div>
</div>
</body>
</html>
